[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "machinelearningmachine"
version = "0.1.0"
description = "Multi-Module Inter-Agent Communication Mesh: Connect Arena AI, Copilot, Claude, GPT, and custom AI agents"
readme = "README.md"
authors = [{ name = "Arena User" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "websockets>=12.0",
]

[project.scripts]
module-mesh = "machinelearningmachine.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

