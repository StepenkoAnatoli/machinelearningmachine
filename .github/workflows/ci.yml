name: CI

# What "the tests pass" is supposed to mean, enforced on every push:
# the suite runs on three Python versions, the linter runs over everything that
# is meant to be code (examples included - three of them were lint-broken while
# their own job reported green), the vendored browser assets are verified against
# their manifest, the browser suites run under jsdom (XSS payloads and the client's
# own survival behaviour), dependencies are audited for
# known CVEs, and the built wheel is *installed and served* before it is called
# shippable.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # constraints.txt is the pinned reference environment, generated on
          # 3.11; one of its pins (websockets 17) requires >=3.11. On 3.10 let pip
          # resolve an older websockets from the declared ranges instead of
          # pretending the pin fits.
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            python -m pip install -e ".[dev]"
          else
            python -m pip install -e ".[dev]" -c constraints.txt
          fi

      - name: Lint
        # examples/ is in scope on purpose: it is documentation that runs, and a
        # file the linter never looks at is a file that silently drifts.
        run: ruff check machinelearningmachine tests scripts examples

      - name: Test
        # -p no:cacheprovider keeps the run hermetic; the suite is offline by
        # design (every network call is injected), so CI needs no egress.
        run: python -m pytest -q -ra --maxfail=25

      - name: Import without the optional deps present
        # The simulator, the mesh and the CLI must work before aiohttp/requests
        # are installed (see machinelearningmachine/_deps.py).
        run: |
          python -m venv .bare
          .bare/bin/python -m pip install --quiet "pydantic>=2.6,<3.0"
          .bare/bin/python -c "import sys; sys.path.insert(0, '.'); import machinelearningmachine; from machinelearningmachine.mesh import AgentMesh; print(AgentMesh().list_agents()[0]['agent_id'])"

  package:
    name: buildable wheel ships the dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Verify packaged assets
        # A wheel without static/ is how this project would ship a 404 dashboard.
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "server/static/index.html",
              "server/static/app.js",
              "server/static/markdown.js",
              "server/static/vendor/MANIFEST.json",
              "server/static/vendor/dompurify/purify.min.js",
              "server/static/vendor/marked/marked.min.js",
              "server/static/vendor/tailwind.css",
              # Vendoring without the third-party license texts would be a
              # compliance bug dressed up as a security fix.
              "server/static/vendor/licenses/marked.txt",
              "server/static/vendor/licenses/tailwindcss.txt",
          ]
          missing = [r for r in required if not any(n.endswith(r) for n in names)]
          assert not missing, f"wheel is missing: {missing}"
          print(f"ok - {wheel} contains the dashboard and its vendored assets")
          PY

      - name: Serve the installed wheel
        # "It imports" is not "it serves". This is the only job that exercises the
        # artifact a user actually gets, from a clean venv, over real HTTP.
        run: |
          python -m venv .smoke
          # No extra to name: pyproject's dependency list is dynamic and reads
          # requirements.txt, which already carries fastapi/uvicorn/aiohttp. (An
          # earlier draft of this step wrote "$wheel[web]" and pip answered
          # "does not provide the extra" - a reminder that install advice has to
          # be tested too.)
          wheel="$(ls dist/*.whl | head -1)"
          .smoke/bin/pip install --quiet "$wheel"
          .smoke/bin/python -m machinelearningmachine --help > /dev/null
          .smoke/bin/module-mesh serve --port 8765 > server.log 2>&1 &
          server_pid=$!
          trap "kill $server_pid 2>/dev/null || true" EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/health > /dev/null 2>&1; then break; fi
            sleep 0.5
            if [ "$i" = 40 ]; then echo "the packaged server never came up:"; cat server.log; exit 1; fi
          done
          curl -fsS http://127.0.0.1:8765/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8765/api/agents | grep -q 'arena-ai'
          curl -fsS http://127.0.0.1:8765/static/app.js | grep -q 'handleWsEvent'
          curl -fsS http://127.0.0.1:8765/ | grep -q 'Inter-Module Agent Mesh'
          curl -fsS -X POST http://127.0.0.1:8765/api/run \
            -H 'Content-Type: application/json' \
            -d '{"topology":"pipeline","prompt":"Design a token bucket rate limiter"}' \
            | grep -q '"status":"completed"'
          # The real end-to-end pass: two browser sessions, a WebSocket, a refused
          # concurrent run, saved-transcript isolation. No TestClient involved.
          .smoke/bin/python scripts/e2e_server_check.py --base http://127.0.0.1:8765
          echo "ok - the wheel serves the dashboard, the mesh and a real run"

  frontend:
    name: vendor integrity + XSS suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Vendored assets match the committed manifest
        # Regenerating must be a deliberate, reviewable commit - not a surprise
        # at runtime. This fails if someone edits vendor/ by hand.
        run: |
          node - <<'JS'
          const fs = require("fs"), path = require("path"), crypto = require("crypto");
          const dir = "machinelearningmachine/server/static/vendor";
          const manifest = JSON.parse(fs.readFileSync(path.join(dir, "MANIFEST.json"), "utf8"));
          for (const [rel, info] of Object.entries(manifest.files)) {
            const bytes = fs.readFileSync(path.join(dir, rel));
            if (bytes.length !== info.bytes) throw new Error(`${rel} size changed (${bytes.length} != ${info.bytes})`);
            const sri = "sha384-" + crypto.createHash("sha384").update(bytes).digest("base64");
            if (sri !== info.sri) throw new Error(`${rel} does not match its recorded SRI hash`);
          }
          console.log(`ok - ${Object.keys(manifest.files).length} vendored files verified`);
          JS
      - name: Rebuild vendor assets and require a clean tree
        run: |
          python3 scripts/build_vendor.py
          git diff --exit-code machinelearningmachine/server/static/vendor \
            || (echo "vendor/ is out of sync with package.json - run: npm install && python3 scripts/build_vendor.py" && exit 1)
      - name: Browser tests (jsdom)
        # The shell expands the glob; node does not. Quoting it would ask node to
        # open a file literally named "tests/js/*.test.mjs", which only works on
        # node >= 21 (glob support in --test) and fails on the node 20 runner.
        run: node --test tests/js/*.test.mjs

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install pip-audit
      - name: pip-audit (declared ranges)
        # Auditing the requirement files rather than the runner's whole
        # environment: the image ships its own old setuptools/pip, and a finding
        # there is not this project's dependency to fix. What matters is whether
        # what we ask for - and what we pin - has known CVEs.
        run: |
          python -m pip_audit --progress-spinner off --desc off -r requirements.txt
          python -m pip_audit --progress-spinner off --desc off -r requirements-dev.txt
      - name: pip-audit (the pinned reference environment)
        run: python -m pip_audit --progress-spinner off --desc off -r constraints.txt
      - name: npm audit (vendored browser dependencies)
        # `npm audit` exits 1 for two opposite situations: a real high+ CVE in
        # a pinned browser dependency, or "audit endpoint returned an error"
        # when registry.npmjs.org answers 429/5xx. Only the first is a finding
        # about this project, and a bare `npm audit` in CI cannot tell them
        # apart - both surface as nothing but "exit code 1".
        #
        # This wrapper separates them: transient endpoint failures are retried
        # and then reported as an infrastructure failure quoting the npm error;
        # a real finding fails with the package, the shipped version, the GHSA
        # and the fix; and an audit that covered zero packages is refused
        # rather than reported green.
        #
        # Exit codes: 0 clean, 1 real high+ finding, 2 audit could not run,
        # 3 nothing was audited.
        run: node scripts/audit_vendor_deps.mjs

  secret-scan:
    name: no credentials committed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Look for key-shaped strings
        # Cheap, and it would have caught the one thing this project must never
        # do: persist the API keys the UI promises are in-memory only.
        run: |
          ! grep -rInE "sk-(ant-|proj-)?[A-Za-z0-9]{30,}" \
            --include='*.py' --include='*.js' --include='*.json' --include='*.md' \
            --exclude-dir=node_modules --exclude-dir=.venv . \
            || (echo "A string shaped like a real API key was found" && exit 1)
          grep -rIn "password\s*=\s*[\"'][^\"']{8,}" machinelearningmachine && exit 1 || true
