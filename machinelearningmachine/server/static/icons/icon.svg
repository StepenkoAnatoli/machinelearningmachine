<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MachineLearningMachine">
  <!--
    The dashboard's app icon. It is the header mark (indigo -> purple -> pink,
    the same three values the compiled stylesheet uses) with the lightning bolt
    drawn as a polygon, so the icon does not depend on a font being installed.

    This file is the source of truth: scripts/make_icons.py rasterises it into
    static/icons/*.png and static/favicon.ico, and tests/test_pwa.py fails if the
    committed images stop matching a fresh render of these exact attributes.
  -->
  <defs>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#brand)"/>
  <polygon fill="#ffffff" points="296,80 168,300 248,300 216,432 344,212 264,212"/>
</svg>
